[project]
name = "pacman"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "commentjson>=0.9.0",
    "mazegenerator",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pygame>=2.6.1",
]

[tool.pyright]
reportMissingTypeStubs = false
stubPath = "typings"
venvPath = "."
venv = ".venv"
reportExplicitAny = false
reportAny = false

[tool.uv.sources]
mazegenerator = { path = "mazegenerator-2.1.0-py3-none-any.whl" }
